<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kelulusan Tempahan Makmal</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1100px; margin: auto; background-color: #f9f9f9; }
        h2 { color: #333; }
        
        .back-btn { display: inline-block; margin-bottom: 15px; color: #2980b9; text-decoration: none; font-weight: bold; }

        table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }

        .status-menunggu { color: #d35400; font-weight: bold; }
        .status-lulus { color: #27ae60; font-weight: bold; }
        .status-tolak { color: #c0392b; font-weight: bold; }

        .btn-lulus { background-color: #27ae60; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-tolak { background-color: #c0392b; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .btn-padam { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        
        .btn-lulus:hover { background-color: #219150; }
        .btn-tolak:hover { background-color: #a93226; }
        .btn-padam:hover { background-color: #922b21; }

        .phone-link { color: #2980b9; font-weight: bold; text-decoration: none; }
        .phone-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <a href="./makmal.html" class="back-btn">⬅️ Kembali ke Senarai Makmal</a>
    <h2>Panel Admin: Kelulusan Tempahan Peralatan</h2>
    <p>Gunakan panel ini untuk meluluskan, menolak, atau memadam tempahan pelajar.</p>

    <table id="jadualAdmin">
        <thead>
            <tr>
                <th>Nama Pemohon</th>
                <th>No. Telefon</th>
                <th>Peralatan</th>
                <th>Tarikh Guna</th>
                <th>Masa</th>
                <th>Tujuan</th>
                <th>Status Semasa</th>
                <th>Tindakan Admin</th>
            </tr>
        </thead>
        <tbody id="isiJadual">
            <tr><td colspan="8" style="text-align:center;">Memuatkan data...</td></tr>
        </tbody>
    </table>

    <script>
        // KAWALAN KESELAMATAN KATA LALUAN
        const KATA_LALUAN_ADMIN = "FKK@20160901"; // Tukar kata laluan di sini
        const inputLaluan = prompt("🔒 KAWALAN ADMIN:\nSila masukkan kata laluan untuk mengakses panel ini:");

        if (inputLaluan !== KATA_LALUAN_ADMIN) {
            alert("❌ Kata laluan salah! Anda tidak mempunyai kebenaran untuk mengakses laman ini.");
            window.location.href = "./makmal.html"; // Tendang pengguna kembali ke laman utama
        }

        document.addEventListener("DOMContentLoaded", function() {
            // TETAPAN SUPABASE
            const supabaseUrl = 'https://mxrtxeczzebkrzayacwy.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14cnR4ZWN6emVia3J6YXlhY3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTU5MDIsImV4cCI6MjEwMjgzMTkwMn0.nsZRuzUpelmfaMiw5fozucrc2XsaaZFxm8Mu28G3wzw';
            
            const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

            // 1. DAPATKAN DATA TEMPAHAN
            async function dapatkanData() {
                const tbody = document.getElementById('isiJadual');
                
                try {
                    const { data, error } = await supabaseClient
                        .from('tempahan_peralatan')
                        .select('*')
                        .order('id', { ascending: false });

                    if (error) {
                        alert("Ralat Supabase: " + error.message);
                        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:red;">Ralat mengambil data dari database.</td></tr>';
                        return;
                    }

                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Tiada rekod tempahan ditemui.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = '';

                    data.forEach(rekod => {
                        const row = tbody.insertRow();
                        
                        let statusSemasa = rekod.status || 'Menunggu';
                        let statusClass = 'status-menunggu';
                        if (statusSemasa === 'Lulus') statusClass = 'status-lulus';
                        if (statusSemasa === 'Ditolak') statusClass = 'status-tolak';

                        const namaPemohon = rekod.nama_pemohon || rekod['Name: nama_pemohon'] || '-';
                        const noTelefon = rekod.no_telefon || rekod.no_tel || rekod.phone || '-';
                        const namaPeralatan = rekod.nama_peralatan || '-';
                        const tarikhGuna = rekod.tarikh_guna || '-';
                        const masaDisplay = (rekod.masa_mula && rekod.masa_tamat) ? `${rekod.masa_mula} - ${rekod.masa_tamat}` : '-';
                        const tujuan = rekod.tujuan || '-';

                        row.insertCell(0).innerText = namaPemohon;
                        
                        const cellPhone = row.insertCell(1);
                        if (noTelefon !== '-' && noTelefon !== '' && noTelefon !== null) {
                            cellPhone.innerHTML = `<a href="tel:${noTelefon}" class="phone-link">📞 ${noTelefon}</a>`;
                        } else {
                            cellPhone.innerText = '-';
                        }

                        row.insertCell(2).innerText = namaPeralatan;
                        row.insertCell(3).innerText = tarikhGuna;
                        row.insertCell(4).innerText = masaDisplay;
                        row.insertCell(5).innerText = tujuan;
                        
                        const cellStatus = row.insertCell(6);
                        cellStatus.innerHTML = `<span class="${statusClass}">${statusSemasa}</span>`;

                        const cellTindakan = row.insertCell(7);
                        
                        const btnLulus = document.createElement('button');
                        btnLulus.className = 'btn-lulus';
                        btnLulus.innerText = 'Lulus';
                        btnLulus.onclick = function() { tukarStatus(rekod.id, 'Lulus'); };

                        const btnTolak = document.createElement('button');
                        btnTolak.className = 'btn-tolak';
                        btnTolak.innerText = 'Tolak';
                        btnTolak.onclick = function() { tukarStatus(rekod.id, 'Ditolak'); };

                        const btnPadam = document.createElement('button');
                        btnPadam.className = 'btn-padam';
                        btnPadam.innerText = '🗑️ Padam';
                        btnPadam.onclick = function() { padamRekod(rekod.id, namaPemohon); };

                        cellTindakan.appendChild(btnLulus);
                        cellTindakan.appendChild(btnTolak);
                        cellTindakan.appendChild(btnPadam);
                    });

                } catch (err) {
                    alert("Ralat sistem: " + err.message);
                }
            }

            // 2. FUNGSI TUKAR STATUS
            async function tukarStatus(id, statusBaru) {
                const { error } = await supabaseClient
                    .from('tempahan_peralatan')
                    .update({ status: statusBaru })
                    .eq('id', id);

                if (error) {
                    alert('Gagal kemaskini: ' + error.message);
                } else {
                    alert(`Status berjaya ditukar kepada: ${statusBaru}`);
                    dapatkanData();
                }
            }

            // 3. FUNGSI PADAM REKOD
            async function padamRekod(id, nama) {
                const sahkan = confirm(`Adakah anda pasti ingin memadam rekod tempahan oleh "${nama}"? Data ini akan dipadam secara kekal dari database.`);
                
                if (sahkan) {
                    const { error } = await supabaseClient
                        .from('tempahan_peralatan')
                        .delete()
                        .eq('id', id);

                    if (error) {
                        alert('Gagal memadam rekod: ' + error.message);
                    } else {
                        alert('✅ Rekod berjaya dipadam secara kekal!');
                        dapatkanData();
                    }
                }
            }

            dapatkanData();
        });
    </script>
</body>
</html>
